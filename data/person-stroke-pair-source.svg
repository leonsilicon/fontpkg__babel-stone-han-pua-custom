BabelStone Han copyright 2009-2022 Andrew West.

This synthetic two-stroke component combines the standalone BabelStone Han
outlines for U+31D2 (㇒) and U+4E36 (丶). Both source contours retain their
original scale and shape:
  - ㇒ is translated by (-31,+181);
  - 丶 is translated by (+168,-67), placing its tip over the middle of ㇒.

